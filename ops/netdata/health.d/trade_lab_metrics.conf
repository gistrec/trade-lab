# Netdata health alarms on the trade-lab Prometheus metrics (go.d/prometheus
# jobs `trade_lab` = testnet :7001, `trade_lab_mainnet` = mainnet :7002,
# exported by ops/health_server.py:/metrics). These complement the httpcheck
# dead-man's-switch with VALUE-based signals.
#
# No scoping needed: each metric is its own chart with a UNIQUE per-job
# context (prometheus.<job>.<metric>), so unlike the httpcheck alarms there
# is no cross-fire — each `on:` context matches exactly one chart. After
# wiring a NEW scrape job, confirm its contexts exist in /api/v1/contexts;
# if the installed Netdata ever emits a shared prometheus.<metric> context
# instead, these templates need `chart labels` scoping (see trade_lab.conf).
#
# Install (restart netdata FIRST if a scrape job was just added — alarms
# cannot attach to charts that do not exist yet — otherwise a health reload
# is enough):
#   sudo cp ops/netdata/health.d/trade_lab_metrics.conf /etc/netdata/health.d/
#   sudo netdatacli reload-health

    template: trade_lab_open_orders
          on: prometheus.trade_lab.tradelab_open_order_incidents
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_open_order_incidents
       units: incidents
       every: 30s
        warn: $this > 0
       delay: down 10m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab has executed orders not in a resolved terminal state (partial / lost_track / timeout) — the "lost_track == 0" SLO is breached

    template: trade_lab_cycle_latency
          on: prometheus.trade_lab.tradelab_cycle_duration_ms_max
       class: Latency
        type: Data Collection
   component: trade-lab
      lookup: max -5m of tradelab_cycle_duration_ms_max
       units: ms
       every: 1m
        warn: $this > 60000
        crit: $this > 120000
       delay: down 15m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab max cycle duration is high (slow exchange round-trips / wait-for-ack backoff / network stall)

    template: trade_lab_journal_read_error
          on: prometheus.trade_lab.tradelab_journal_read_error
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_journal_read_error
       units: boolean
       every: 30s
        crit: $this > 0
       delay: down 5m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab journal is unreadable (permission / mount / corruption) — monitoring is blind

# ── Mainnet (real money): the same three alarms on the mainnet job ───────────

    template: trade_lab_mainnet_open_orders
          on: prometheus.trade_lab_mainnet.tradelab_open_order_incidents
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_open_order_incidents
       units: incidents
       every: 30s
        warn: $this > 0
       delay: down 10m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab MAINNET has executed orders not in a resolved terminal state (partial / lost_track / timeout) — the "lost_track == 0" SLO is breached on real money

    template: trade_lab_mainnet_cycle_latency
          on: prometheus.trade_lab_mainnet.tradelab_cycle_duration_ms_max
       class: Latency
        type: Data Collection
   component: trade-lab
      lookup: max -5m of tradelab_cycle_duration_ms_max
       units: ms
       every: 1m
        warn: $this > 60000
        crit: $this > 120000
       delay: down 15m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab MAINNET max cycle duration is high (slow exchange round-trips / wait-for-ack backoff / network stall)

    template: trade_lab_mainnet_journal_read_error
          on: prometheus.trade_lab_mainnet.tradelab_journal_read_error
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_journal_read_error
       units: boolean
       every: 30s
        crit: $this > 0
       delay: down 5m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab MAINNET journal is unreadable (permission / mount / corruption) — monitoring is blind

# ── Mainnet-only business alarms ─────────────────────────────────────────────

# Cumulative over the whole journal (monotonic), so once raised it stays
# raised until the owner reviews — a persistent SLO layer, not a blip.
    template: trade_lab_mainnet_skipped_drift
          on: prometheus.trade_lab_mainnet.tradelab_cumulative_skipped_drift_usd
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_cumulative_skipped_drift_usd
       units: USD
       every: 1m
        warn: $this > 5
       delay: down 1h multiplier 1.5 max 6h
          to: botcrit
        info: trade-lab MAINNET cumulative skipped quote drift above 5 USDT (~5% of the ~100 USDT live book) — skipped rebalance deltas are adding up

# tradelab_equity_usd only changes after a SUCCESSFUL cycle and the live
# cadence is daily (the exporter re-serves the last value between cycles),
# so the baseline must span at least two live cycles — hence -2d.
    template: trade_lab_mainnet_equity_drop
          on: prometheus.trade_lab_mainnet.tradelab_equity_usd
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -2d unaligned of tradelab_equity_usd
        calc: $this > 0 ? 100 * ($this - $tradelab_equity_usd) / $this : 0
       units: %
       every: 1m
        warn: $this > 10
       delay: down 1h multiplier 1.5 max 6h
          to: botcrit
        info: trade-lab MAINNET equity dropped more than 10% from its 2-day high — check the journal and the market before assuming a bot bug
