# Netdata health alarms on the trade-lab Prometheus metrics (go.d/prometheus
# jobs `trade_lab` = testnet :7001, `trade_lab_mainnet` = mainnet :7002,
# exported by ops/health_server.py:/metrics). These complement the httpcheck
# dead-man's-switch with VALUE-based signals.
#
# No scoping needed: each metric is its own chart with a UNIQUE per-job
# context (prometheus.<job>.<metric>), so unlike the httpcheck alarms there
# is no cross-fire — each `on:` context matches exactly one chart. After
# wiring a NEW scrape job, confirm its contexts exist in /api/v1/contexts;
# if the installed Netdata ever emits a shared prometheus.<metric> context
# instead, these templates need `chart labels` scoping (see trade_lab.conf).
#
# Install (restart netdata FIRST if a scrape job was just added — alarms
# cannot attach to charts that do not exist yet — otherwise a health reload
# is enough):
#   sudo cp ops/netdata/health.d/trade_lab_metrics.conf /etc/netdata/health.d/
#   sudo netdatacli reload-health

    template: trade_lab_open_orders
          on: prometheus.trade_lab.tradelab_open_order_incidents
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_open_order_incidents
       units: incidents
       every: 30s
        warn: $this > 0
       delay: down 10m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab has unresolved executed orders (rejected / lost_track / timeout with no later resolution by client_order_id) — the "lost_track == 0" SLO is breached

    template: trade_lab_cycle_latency
          on: prometheus.trade_lab.tradelab_last_cycle_duration_ms
       class: Latency
        type: Data Collection
   component: trade-lab
      lookup: max -5m of tradelab_last_cycle_duration_ms
       units: ms
       every: 1m
        warn: $this > 60000
        crit: $this > 120000
       delay: down 15m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab LATEST cycle duration is high (slow exchange round-trips / wait-for-ack backoff / network stall) — clears on the next fast cycle, unlike the sticky 200-cycle _max series

    template: trade_lab_journal_read_error
          on: prometheus.trade_lab.tradelab_journal_read_error
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_journal_read_error
       units: boolean
       every: 30s
        crit: $this > 0
       delay: down 5m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab journal is unreadable (permission / mount / corruption) — monitoring is blind

# ── Mainnet (real money): the same three alarms on the mainnet job ───────────

    template: trade_lab_mainnet_open_orders
          on: prometheus.trade_lab_mainnet.tradelab_open_order_incidents
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_open_order_incidents
       units: incidents
       every: 30s
        warn: $this > 0
       delay: down 10m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab MAINNET has unresolved executed orders (rejected / lost_track / timeout with no later resolution by client_order_id) — the "lost_track == 0" SLO is breached on real money

    template: trade_lab_mainnet_cycle_latency
          on: prometheus.trade_lab_mainnet.tradelab_last_cycle_duration_ms
       class: Latency
        type: Data Collection
   component: trade-lab
      lookup: max -5m of tradelab_last_cycle_duration_ms
       units: ms
       every: 1m
        warn: $this > 60000
        crit: $this > 120000
       delay: down 15m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab MAINNET LATEST cycle duration is high (slow exchange round-trips / wait-for-ack backoff / network stall) — clears on the next fast cycle, unlike the sticky 200-cycle _max series

    template: trade_lab_mainnet_journal_read_error
          on: prometheus.trade_lab_mainnet.tradelab_journal_read_error
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_journal_read_error
       units: boolean
       every: 30s
        crit: $this > 0
       delay: down 5m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab MAINNET journal is unreadable (permission / mount / corruption) — monitoring is blind

# ── Mainnet-only business alarms ─────────────────────────────────────────────

# Cumulative over the whole journal (monotonic), so once raised it stays
# raised until the owner reviews — a persistent SLO layer, not a blip.
    template: trade_lab_mainnet_skipped_drift
          on: prometheus.trade_lab_mainnet.tradelab_cumulative_skipped_drift_usd
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_cumulative_skipped_drift_usd
       units: USD
       every: 1m
        warn: $this > 5
       delay: down 1h multiplier 1.5 max 6h
          to: botcrit
        info: trade-lab MAINNET cumulative skipped quote drift above 5 USDT (~5% of the ~100 USDT live book) — skipped rebalance deltas are adding up

# tradelab_equity_usd only changes after a SUCCESSFUL cycle and the live
# cadence is daily (the exporter re-serves the last value between cycles),
# so the baseline must span at least two live cycles — hence -2d.
    template: trade_lab_mainnet_equity_drop
          on: prometheus.trade_lab_mainnet.tradelab_equity_usd
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -2d unaligned of tradelab_equity_usd
        calc: $this > 0 ? 100 * ($this - $tradelab_equity_usd) / $this : 0
       units: %
       every: 1m
        warn: $this > 10
       delay: down 1h multiplier 1.5 max 6h
          to: botcrit
        info: trade-lab MAINNET equity dropped more than 10% from its 2-day high — check the journal and the market before assuming a bot bug

# Absolute floor complementing the relative equity_drop above: below ~70 USDT
# the 0.5-ladder half-step (0.5/7 x equity) falls under the 5 USDT
# min-notional and orders start skipping; 80 is the approach buffer.
    template: trade_lab_mainnet_equity_floor
          on: prometheus.trade_lab_mainnet.tradelab_equity_usd
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_equity_usd
       units: USD
       every: 1m
        warn: $this < 80
       delay: down 1h multiplier 1.5 max 6h
          to: botcrit
        info: trade-lab MAINNET equity is under 80 USDT, approaching the ~70 USDT floor where the ladder half-step breaks min-notional — top up to the recommended 110-125 USDT (manual owner action, see execution README "Capital floor")

# --- db-mirror durability -----------------------------------------------
# The mirror is the only durability layer for journal/state/vintages (the
# host is disposable); mirror_after_cycle never fails the cycle, so a broken
# mirror becomes visible only here. Metrics come from the per-environment
# mirror_status*.json written after every cycle.

    template: trade_lab_mirror_success_age
          on: prometheus.trade_lab.tradelab_mirror_last_success_age_seconds
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_mirror_last_success_age_seconds
       units: seconds
       every: 1m
        crit: $this > 50400
       delay: down 15m multiplier 1.5 max 1h
          to: botcrit
        info: db mirror has not completed for over 14h (two 6-hourly cycles + grace) — journal/state/vintages exist only on this disposable host

    template: trade_lab_mirror_failed
          on: prometheus.trade_lab.tradelab_mirror_failed
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_mirror_failed
       units: boolean
       every: 1m
        warn: $this > 0
       delay: down 15m multiplier 1.5 max 1h
          to: botcrit
        info: the last post-cycle db-mirror attempt failed (trading unaffected, durability degraded — check the cron log)

# The mainnet health app derives its own mirror_status_mainnet.json from the
# mainnet journal path, so the same two alarms exist on the mainnet job (the
# 6-hourly mainnet dry-run cron refreshes the mirror there as well).
    template: trade_lab_mainnet_mirror_success_age
          on: prometheus.trade_lab_mainnet.tradelab_mirror_last_success_age_seconds
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_mirror_last_success_age_seconds
       units: seconds
       every: 1m
        crit: $this > 50400
       delay: down 15m multiplier 1.5 max 1h
          to: botcrit
        info: MAINNET db mirror has not completed for over 14h (two 6-hourly cycles + grace) — the real-money journal/state exist only on this disposable host

    template: trade_lab_mainnet_mirror_failed
          on: prometheus.trade_lab_mainnet.tradelab_mirror_failed
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: max -1m of tradelab_mirror_failed
       units: boolean
       every: 1m
        warn: $this > 0
       delay: down 15m multiplier 1.5 max 1h
          to: botcrit
        info: the last MAINNET post-cycle db-mirror attempt failed (trading unaffected, durability degraded — check the cron log)
